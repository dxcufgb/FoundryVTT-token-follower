# CodeRabbit settings for FoundryVTT-token-follower.
# Shared rules come from the central dxcufgb/coderabbit repository (inheritance: true), and CodeRabbit reads
# the README as code guidelines. Only what is specific to this repository is here.
# Check the merged result on a pull request with: @coderabbitai configuration
inheritance: true

reviews:
  path_instructions:
    - path: "scripts/**/*.js"
      instructions: |
        A token follows another, also across scenes. Socket messages come from any client: validate type, ids
        and targets, and never let one move or pull another user's view unless it is the GM's request. Token
        moves are done by the token's owner or the active GM only, once (not by every client). Creating a
        follower token on another scene is a GM action. Following must stop cleanly when either token is
        deleted, and must not loop (A follows B follows A).
    - path: ".github/workflows/{ci,release}.yml"
      instructions: |
        Thin callers of dxcufgb/foundry-module-ci, identical in every Foundry module repository. Flag any change
        here that is not the same change in all modules (it belongs in foundry-module-ci instead), except the
        pinned SHA of foundry-module-ci itself.
